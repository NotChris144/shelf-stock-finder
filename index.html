<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stock" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://search.webuy.io" crossorigin />
    <link rel="preconnect" href="https://uk.static.webuy.com" />
    <title>Stock</title>
  </head>
  <body>
    <!-- The screen is titled by where it is: the store. It scrolls away with the page, as a large title does. -->
    <header class="lead" id="lead">
      <button type="button" class="place" data-act="more" aria-label="Change store or settings">
        <span id="storeName">Eastbourne</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </header>
    <div class="top">
      <form class="search" id="form" role="search" action="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input
          id="q"
          type="search"
          inputmode="search"
          enterkeyhint="search"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Search stock"
          placeholder="Search stock…"
        />
        <button type="button" class="scan-open" data-act="scan" aria-label="Scan a label barcode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 8.5v7M11 8.5v7M13.5 8.5v7M16 8.5v7" /></svg>
        </button>
        <button type="button" id="clear" data-act="clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </form>
      <nav class="chips presets" id="presets" aria-label="Categories"></nav>
    </div>
    <section class="filters" id="filters" aria-label="Filters" hidden></section>
    <main id="results"></main>
    <p class="hold-tip" id="holdTip" hidden>Tip: hold Filters and slide up. Slide left for more.</p>
    <nav class="dock" aria-label="Quick actions">
      <button type="button" class="dock-btn" id="dockHome" data-act="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" /></svg><span>Start</span>
      </button>
      <button type="button" class="dock-btn" id="dockSearch" data-act="dock-search" aria-description="Hold to scan a barcode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg><span>Search</span>
      </button>
      <button type="button" class="dock-btn" id="dockFilters" data-act="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg><span id="dockFiltersLabel">Filters</span>
      </button>
    </nav>
    <div class="hold" id="hold" hidden></div>
    <dialog class="sheet" id="sheet" aria-label="Filters"></dialog>
    <dialog class="scanner" id="scanner" aria-label="Barcode scanner"></dialog>
    <dialog class="cover" id="cover" aria-label="Spine and cover"></dialog>
    <p class="toast" id="toast" role="status" popover="manual" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
