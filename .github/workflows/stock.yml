name: Stock activity

# Keeps watch over Eastbourne's stock through the day (scripts/stock-watch.sh): a look a minute
# after each of CeX's 10-minute updates, recording what has come in and what has gone
# (scripts/track-stock.ts), and every half hour a look for new spec sheets (scripts/update-specs.ts).
#
# GitHub's timer only starts the day's watch. It proved unreliable, so it is asked several
# times each morning, and once a watch is running it carries itself on: shortly before GitHub's
# six-hour limit it starts its own successor. Runs never overlap (see `concurrency`); a start
# that arrives while a watch is running waits, and is dropped if the watch hands over first.
#
# The stock record lives on its own branch, `stock-data`, as a single commit that is replaced each
# time, so it never builds up history. The app reads log.json straight from that branch, so new
# stock shows without redeploying the site.

on:
  schedule:
    # 07:04 to 09:34 UTC covers 8am to 9am UK in winter and summer; the later ones restart a
    # watch that has stopped for any reason.
    - cron: '4,34 7-9 * * *'
    - cron: '4 11,14,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To start its own successor and the site's rebuild.
  actions: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Spec pages already read are kept between runs, so the day's allowance is not spent twice.
      - uses: actions/cache@v6
        with:
          path: .cache/specs
          key: specs-pages-${{ github.run_id }}
          restore-keys: specs-pages-
      - name: Keep watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/stock-watch.sh
